<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">共享单车数据分析、数据库与前端大屏代码结构图</title>
  <desc id="desc">项目包含 UCI 数据分析链路、Kaggle 数据数据库链路和 ECharts 前端大屏链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#64748b"/></marker>
    <style>
      .box{stroke-width:2;rx:12}.data{fill:#fef3c7;stroke:#d97706}.module{fill:#e0f2fe;stroke:#0284c7}.output{fill:#dcfce7;stroke:#16a34a}.test{fill:#f3e8ff;stroke:#9333ea}
      .heading{font:700 19px sans-serif;fill:#0f172a}.title{font:700 23px sans-serif;fill:#0f172a}.name{font:700 15px sans-serif;fill:#0c4a6e}.note{font:13px sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1200" height="710" fill="#fff"/>
  <text x="600" y="38" text-anchor="middle" class="title">共享单车项目 · 代码结构图</text>

  <text x="250" y="82" text-anchor="middle" class="heading">① UCI 数据分析与静态图表</text>
  <rect x="55" y="105" width="180" height="76" class="box data"/><text x="145" y="136" text-anchor="middle" class="name">UCI hour.csv</text><text x="145" y="160" text-anchor="middle" class="note">原始小时数据</text>
  <rect x="315" y="105" width="180" height="76" class="box module"/><text x="405" y="136" text-anchor="middle" class="name">loader.py</text><text x="405" y="160" text-anchor="middle" class="note">字段校验</text>
  <path d="M235 143 H315" class="line"/>
  <rect x="315" y="230" width="180" height="76" class="box module"/><text x="405" y="261" text-anchor="middle" class="name">cleaner.py</text><text x="405" y="285" text-anchor="middle" class="note">数据清洗</text>
  <path d="M405 181 V230" class="line"/>
  <rect x="315" y="355" width="180" height="76" class="box module"/><text x="405" y="386" text-anchor="middle" class="name">metrics.py</text><text x="405" y="410" text-anchor="middle" class="note">统计指标</text>
  <path d="M405 306 V355" class="line"/>
  <rect x="315" y="480" width="180" height="76" class="box module"/><text x="405" y="511" text-anchor="middle" class="name">charts.py</text><text x="405" y="535" text-anchor="middle" class="note">PNG 图表生成</text>
  <path d="M405 431 V480" class="line"/>
  <rect x="315" y="595" width="180" height="70" class="box output"/><text x="405" y="624" text-anchor="middle" class="name">reports/figures</text><text x="405" y="647" text-anchor="middle" class="note">静态分析图表</text>
  <path d="M405 556 V595" class="line"/>
  <rect x="55" y="355" width="180" height="76" class="box module"/><text x="145" y="386" text-anchor="middle" class="name">main.py</text><text x="145" y="410" text-anchor="middle" class="note">流程编排入口</text><path d="M235 393 H315" class="line dash"/>

  <text x="880" y="82" text-anchor="middle" class="heading">② 数据库、查询接口与前端大屏</text>
  <rect x="635" y="105" width="190" height="76" class="box data"/><text x="730" y="136" text-anchor="middle" class="name">Kaggle bike_data.csv</text><text x="730" y="160" text-anchor="middle" class="note">整理后业务数据</text>
  <rect x="895" y="105" width="180" height="76" class="box module"/><text x="985" y="136" text-anchor="middle" class="name">init_db.py</text><text x="985" y="160" text-anchor="middle" class="note">建库/导入/索引</text><path d="M825 143 H895" class="line"/>
  <rect x="895" y="230" width="180" height="76" class="box output"/><text x="985" y="261" text-anchor="middle" class="name">bike_sharing.db</text><text x="985" y="285" text-anchor="middle" class="note">SQLite bike_usage 表</text><path d="M985 181 V230" class="line"/>
  <rect x="895" y="355" width="180" height="76" class="box module"/><text x="985" y="386" text-anchor="middle" class="name">db_helper.py</text><text x="985" y="410" text-anchor="middle" class="note">KPI/天气/小时查询</text><path d="M985 306 V355" class="line"/>
  <rect x="895" y="480" width="180" height="76" class="box module"/><text x="985" y="511" text-anchor="middle" class="name">api.py</text><text x="985" y="535" text-anchor="middle" class="note">本地 JSON API</text><path d="M985 431 V480" class="line"/>
  <rect x="635" y="355" width="190" height="76" class="box module"/><text x="730" y="386" text-anchor="middle" class="name">process_data.py</text><text x="730" y="410" text-anchor="middle" class="note">生成大屏统计数据</text><path d="M730 181 V355" class="line"/>
  <rect x="635" y="480" width="190" height="76" class="box output"/><text x="730" y="511" text-anchor="middle" class="name">data.json</text><text x="730" y="535" text-anchor="middle" class="note">前端图表数据</text><path d="M730 431 V480" class="line"/>
  <rect x="635" y="595" width="190" height="70" class="box module"/><text x="730" y="624" text-anchor="middle" class="name">index.html</text><text x="730" y="647" text-anchor="middle" class="note">ECharts 数据大屏</text><path d="M730 556 V595" class="line"/>
  <path d="M985 556 V630 H825" class="line dash"/>
  <rect x="1020" y="595" width="130" height="70" class="box test"/><text x="1085" y="624" text-anchor="middle" class="name">tests/</text><text x="1085" y="647" text-anchor="middle" class="note">模块验证</text>
  <text x="55" y="694" class="note">实线：数据或调用流；虚线：可扩展调用或测试关系。</text>
</svg>
